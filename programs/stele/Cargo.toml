[package]
name = "stele"
description = "Stele — verifiable agreement protocol: immutable document versions and on-chain-verified acceptance records"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "stele"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
bytemuck = { workspace = true }
solana-instructions-sysvar = { workspace = true }
solana-sdk-ids = { workspace = true }
stele-core = { workspace = true }

[dev-dependencies]
litesvm = { version = "0.17.0", features = ["precompiles"] }
openssl = "0.10.81"
solana-account = "4.3.0"
solana-address = "2.7.0"
solana-clock = "3.2.0"
solana-instruction = "3.5.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-secp256r1-program = "3.0.0"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
stele-canonical = { path = "../../crates/stele-canonical" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
