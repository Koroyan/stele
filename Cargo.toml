[workspace]
resolver = "2"
members = [
    "programs/stele",
    "programs/gate-demo",
    "crates/stele-core",
    "crates/stele-canonical",
    "crates/stele-gate",
    # Test fixture for the program tests; never deployed.
    "tests/programs/cpi-probe",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"
publish = false

[workspace.dependencies]
anchor-lang = "=1.2.0"
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
bytemuck = { version = "1.23", features = ["derive", "min_const_generics"] }
solana-sha256-hasher = { version = "3.1.0", features = ["sha2"] }
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1.24"
hex = "0.4"
stele-core = { path = "crates/stele-core" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
