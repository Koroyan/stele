  - "@solana/instructions@8.4.0"
  - "@solana/keys@8.4.0"
  - "@solana/kit@8.4.0"
  - "@solana/nominal-types@8.4.0"
  - "@solana/offchain-messages@8.4.0"
  - "@solana/options@8.4.0"
